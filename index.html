<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak — your English coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14162B;
    --surface:#1D2044;
    --surface-alt:#262A52;
    --line: #33376A;
    --text:#F5F6FA;
    --text-muted:#9CA3C4;
    --accent:#8C9EFF;
    --gold:#F5C56B;
    --record:#FF6F91;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  #app{
    width:100%;
    max-width:480px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
  }
  .streak{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    color:var(--gold);
    font-weight:500;
  }
  .gear{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:18px;
    cursor:pointer;
    padding:4px;
  }
  #log{
    flex:1;
    overflow-y:auto;
    padding:20px 18px 10px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .bubble{
    max-width:82%;
    padding:12px 15px;
    border-radius:16px;
    line-height:1.45;
    font-size:15.5px;
    white-space:pre-wrap;
  }
  .bubble.ai{
    align-self:flex-start;
    background:var(--surface);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .bubble.user{
    align-self:flex-end;
    background:var(--accent);
    color:#141633;
    border-bottom-right-radius:4px;
  }
  .bubble.system{
    align-self:center;
    color:var(--text-muted);
    font-size:13px;
    text-align:center;
    max-width:90%;
  }
  #status{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    min-height:18px;
    padding-bottom:4px;
  }
  #controls{
    padding:14px 0 28px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
  }
  #mic{
    width:78px;
    height:78px;
    border-radius:50%;
    border:none;
    background:var(--record);
    color:#1a0b12;
    font-size:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    z-index:2;
    box-shadow:0 6px 24px rgba(255,111,145,0.35);
    transition:transform 0.15s ease;
  }
  #mic:active{transform:scale(0.94);}
  #mic.listening{background:var(--gold);}
  .ring{
    position:absolute;
    border-radius:50%;
    border:2px solid var(--record);
    opacity:0;
    width:78px;
    height:78px;
  }
  .ring.animate{
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse{
    0%{ transform:scale(1); opacity:0.6; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  /* Onboarding overlay */
  #setup{
    position:absolute;
    inset:0;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:32px 26px;
    gap:16px;
    z-index:10;
  }
  #setup h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 4px;
  }
  #setup p{
    color:var(--text-muted);
    font-size:14.5px;
    line-height:1.5;
    margin:0;
  }
  #setup a{color:var(--accent);}
  #setup input, #setup select{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    padding:13px 14px;
    border-radius:10px;
    font-size:15px;
    width:100%;
  }
  #setup button{
    background:var(--accent);
    color:#141633;
    border:none;
    padding:13px 14px;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">

  <div id="setup">
    <h2>Let's get set up</h2>
    <p>Paste your free Gemini API key below. It's saved only on this device — never uploaded anywhere.</p>
    <p>Don't have one yet? Get it free at <a href="https://aistudio.google.com" target="_blank">aistudio.google.com</a> → "Get API key".</p>
    <input id="keyInput" type="text" placeholder="Paste your API key here" autocapitalize="off" autocorrect="off">
    <p style="margin-top:6px;">Voice for your tutor:</p>
    <select id="voiceSelect"></select>
    <button id="testVoice" type="button" style="background:var(--surface-alt);color:var(--text);border:1px solid var(--line);">Test this voice</button>
    <label style="display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:14px;margin-top:4px;">
      <input type="checkbox" id="useAiVoice" style="width:auto;">
      Use high-quality AI voice (Google, adds ~1-2s delay)
    </label>
    <button id="saveKey">Save and start</button>
  </div>

  <header>
    <h1>Speak</h1>
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="streak">🔥 <span id="streakCount">0</span></div>
      <button class="gear" id="settingsBtn" title="Settings">⚙︎</button>
    </div>
  </header>

  <div id="log"></div>
  <div id="status"></div>

  <div id="controls">
    <div class="ring" id="ring1"></div>
    <div class="ring" id="ring2"></div>
    <button id="mic">🎙️</button>
  </div>

</div>

<script>
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const micBtn = document.getElementById('mic');
const setupEl = document.getElementById('setup');
const keyInput = document.getElementById('keyInput');
const saveKeyBtn = document.getElementById('saveKey');
const settingsBtn = document.getElementById('settingsBtn');
const streakCountEl = document.getElementById('streakCount');
const ring1 = document.getElementById('ring1');
const ring2 = document.getElementById('ring2');

let apiKey = localStorage.getItem('geminiApiKey');
let conversation = JSON.parse(localStorage.getItem('speakConversation') || '[]');

const SYSTEM_INSTRUCTION = `You are a warm, encouraging private English speaking tutor with a British accent and personality.
The learner's first language is Persian. Your job right now is simple: have a natural, spontaneous spoken conversation with them in English only — never use Persian, ever.
Keep your replies short and conversational (1-3 sentences), like real spoken dialogue, not a lecture.
Ask natural follow-up questions. Occasionally change the subject unexpectedly or ask something a little unexpected, the way a curious conversation partner would.
If the learner pauses, hesitates, or writes something incomplete, respond naturally and encouragingly rather than correcting everything — this is an early version focused on natural conversation flow.`;

function initStreak(){
  const data = JSON.parse(localStorage.getItem('speakStreak') || '{"count":0,"lastDate":""}');
  const today = new Date().toDateString();
  if(data.lastDate !== today){
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    data.count = (data.lastDate === yesterday) ? data.count + 1 : 1;
    data.lastDate = today;
    localStorage.setItem('speakStreak', JSON.stringify(data));
  }
  streakCountEl.textContent = data.count;
}

function addBubble(text, who){
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function saveConversation(){
  localStorage.setItem('speakConversation', JSON.stringify(conversation.slice(-20)));
}

// ---- Setup / API key handling ----
function checkSetup(){
  if(apiKey){
    setupEl.classList.add('hidden');
  } else {
    setupEl.classList.remove('hidden');
  }
}
const useAiVoiceCheckbox = document.getElementById('useAiVoice');
useAiVoiceCheckbox.checked = localStorage.getItem('useAiVoice') === 'true';

saveKeyBtn.addEventListener('click', () => {
  const val = keyInput.value.trim();
  if(!val){ return; }
  apiKey = val;
  localStorage.setItem('geminiApiKey', apiKey);
  localStorage.setItem('useAiVoice', useAiVoiceCheckbox.checked);
  checkSetup();
});
settingsBtn.addEventListener('click', () => {
  keyInput.value = apiKey || '';
  useAiVoiceCheckbox.checked = localStorage.getItem('useAiVoice') === 'true';
  setupEl.classList.remove('hidden');
});

// ---- Speech recognition (speech-to-text) ----
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

let lastInterim = '';
let gotFinal = false;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'en-GB';
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    listening = true;
    lastInterim = '';
    gotFinal = false;
    micBtn.classList.add('listening');
    ring1.classList.add('animate');
    ring2.classList.add('animate');
    ring2.style.animationDelay = '0.5s';
    statusEl.textContent = 'Listening… speak now';
  };

  recognition.onspeechstart = () => {
    statusEl.textContent = 'Hearing you…';
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    ring1.classList.remove('animate');
    ring2.classList.remove('animate');
    // Fallback: if we captured interim text but never got a final result, use it anyway
    if(!gotFinal && lastInterim.trim()){
      const transcript = lastInterim.trim();
      lastInterim = '';
      addBubble(transcript, 'user');
      sendToTutor(transcript);
    } else if(!gotFinal){
      statusEl.textContent = "Didn't catch any words — try again, a bit closer to the mic";
    }
  };

  recognition.onerror = (e) => {
    statusEl.textContent = 'Mic error: ' + e.error + ' — try again';
  };

  recognition.onresult = (event) => {
    let interim = '';
    for(let i = event.resultIndex; i < event.results.length; i++){
      const res = event.results[i];
      if(res.isFinal){
        gotFinal = true;
        const transcript = res[0].transcript;
        addBubble(transcript, 'user');
        sendToTutor(transcript);
      } else {
        interim += res[0].transcript;
      }
    }
    if(interim){
      lastInterim = interim;
      statusEl.textContent = '"' + interim + '"';
    }
  };
} else {
  statusEl.textContent = 'Speech recognition not supported in this browser.';
}

let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked || !window.speechSynthesis) return;
  const silent = new SpeechSynthesisUtterance(' ');
  silent.volume = 0;
  window.speechSynthesis.speak(silent);
  audioUnlocked = true;
}

micBtn.addEventListener('click', () => {
  unlockAudio(); // must happen directly inside the tap, before anything async
  unlockAudioElement();
  if(!apiKey){ checkSetup(); return; }
  if(!recognition){ return; }
  if(listening){
    recognition.stop();
  } else {
    try{ recognition.start(); } catch(e){ /* already started */ }
  }
});

// ---- Text-to-speech (British voice) ----
let cachedVoices = [];
const voiceSelect = document.getElementById('voiceSelect');
const testVoiceBtn = document.getElementById('testVoice');

function populateVoiceList(){
  cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  const english = cachedVoices.filter(v => v.lang && v.lang.startsWith('en'));
  const savedURI = localStorage.getItem('ttsVoiceURI');
  voiceSelect.innerHTML = '';
  english.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.voiceURI;
    opt.textContent = v.name + ' (' + v.lang + ')';
    if(v.voiceURI === savedURI) opt.selected = true;
    voiceSelect.appendChild(opt);
  });
  // Default-select the first en-GB voice if nothing saved yet
  if(!savedURI){
    const firstGB = english.find(v => v.lang === 'en-GB');
    if(firstGB) voiceSelect.value = firstGB.voiceURI;
  }
}
if(window.speechSynthesis){
  populateVoiceList();
  window.speechSynthesis.onvoiceschanged = populateVoiceList;
}
voiceSelect.addEventListener('change', () => {
  localStorage.setItem('ttsVoiceURI', voiceSelect.value);
});
testVoiceBtn.addEventListener('click', () => {
  unlockAudio();
  unlockAudioElement();
  localStorage.setItem('ttsVoiceURI', voiceSelect.value);
  localStorage.setItem('useAiVoice', useAiVoiceCheckbox.checked);
  speak("Hello! This is what I'll sound like.");
});

function getSelectedVoice(){
  const savedURI = localStorage.getItem('ttsVoiceURI');
  if(savedURI){
    const match = cachedVoices.find(v => v.voiceURI === savedURI);
    if(match) return match;
  }
  return cachedVoices.find(v => v.lang === 'en-GB') || cachedVoices.find(v => v.lang && v.lang.startsWith('en-GB'));
}

function speak(text){
  const useAi = localStorage.getItem('useAiVoice') === 'true';
  if(useAi && apiKey){
    speakWithGemini(text).catch((err) => {
      addBubble('AI voice unavailable (' + err.message + ') — using standard voice instead.', 'system');
      speakBrowser(text);
    });
  } else {
    speakBrowser(text);
  }
}

// ---- High-quality AI voice via Gemini TTS ----
let audioUnlockedEl = false;
function unlockAudioElement(){
  if(audioUnlockedEl) return;
  const silent = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=");
  silent.play().catch(()=>{});
  audioUnlockedEl = true;
}

function pcmBase64ToWavBlob(base64Data, sampleRate){
  const binary = atob(base64Data);
  const len = binary.length;
  const pcmBytes = new Uint8Array(len);
  for(let i=0;i<len;i++) pcmBytes[i] = binary.charCodeAt(i);

  const numChannels = 1, bitsPerSample = 16;
  const blockAlign = numChannels * bitsPerSample/8;
  const byteRate = sampleRate * blockAlign;
  const header = new ArrayBuffer(44);
  const view = new DataView(header);
  const writeStr = (offset, str) => { for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); };
  writeStr(0,'RIFF'); view.setUint32(4, 36+len, true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numChannels,true); view.setUint32(24,sampleRate,true);
  view.setUint32(28,byteRate,true); view.setUint16(32,blockAlign,true); view.setUint16(34,bitsPerSample,true);
  writeStr(36,'data'); view.setUint32(40,len,true);

  const wavBytes = new Uint8Array(header.byteLength + len);
  wavBytes.set(new Uint8Array(header), 0);
  wavBytes.set(pcmBytes, header.byteLength);
  return new Blob([wavBytes], {type:'audio/wav'});
}

async function speakWithGemini(text){
  statusEl.textContent = '🔊 Preparing voice…';
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-tts-preview:generateContent?key=${apiKey}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      contents:[{ parts:[{ text: text }] }],
      generationConfig:{
        responseModalities:['AUDIO'],
        speechConfig:{
          voiceConfig:{ prebuiltVoiceConfig:{ voiceName:'Puck' } },
          languageCode:'en-GB'
        }
      }
    })
  });
  const data = await res.json();
  const part = data?.candidates?.[0]?.content?.parts?.[0];
  if(!part?.inlineData?.data){
    const debugInfo = data.error ? data.error.message : JSON.stringify(data).slice(0, 250);
    throw new Error(debugInfo);
  }

  let sampleRate = 24000;
  const mime = part.inlineData.mimeType || '';
  const rateMatch = mime.match(/rate=(\d+)/);
  if(rateMatch) sampleRate = parseInt(rateMatch[1], 10);

  const blob = pcmBase64ToWavBlob(part.inlineData.data, sampleRate);
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  statusEl.textContent = '🔊 Speaking…';
  audio.onended = () => { statusEl.textContent = ''; URL.revokeObjectURL(url); };
  await audio.play();
}

function speakBrowser(text){
  if(!window.speechSynthesis){
    addBubble('(This browser has no text-to-speech support.)', 'system');
    return;
  }
  window.speechSynthesis.cancel(); // clear any stuck queue first
  const utter = new SpeechSynthesisUtterance(text);
  const chosen = getSelectedVoice();
  if(chosen) utter.voice = chosen;
  utter.lang = 'en-GB';
  utter.rate = 0.98;
  utter.volume = 1;

  utter.onstart = () => { statusEl.textContent = '🔊 Speaking…'; };
  utter.onend = () => { statusEl.textContent = ''; };
  utter.onerror = (e) => {
    addBubble('Voice error: ' + e.error, 'system');
  };

  window.speechSynthesis.speak(utter);
}

// ---- Calling Gemini ----
async function sendToTutor(userText){
  statusEl.textContent = 'Thinking…';
  conversation.push({ role:'user', parts:[{text:userText}] });

  const body = {
    system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
    contents: conversation
  };

  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if(data.error){
      statusEl.textContent = '';
      addBubble('Error: ' + data.error.message, 'system');
      return;
    }

    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I didn't catch that — try again?";
    conversation.push({ role:'model', parts:[{text: reply}] });
    saveConversation();
    statusEl.textContent = '';
    addBubble(reply, 'ai');
    speak(reply);

  } catch(err){
    statusEl.textContent = '';
    addBubble('Connection error — check that your VPN is on, then try again.', 'system');
  }
}

// ---- Init ----
checkSetup();
initStreak();
if(conversation.length === 0){
  addBubble("Hello! Tap the microphone whenever you're ready, and let's just talk.", 'ai');
} else {
  addBubble('Welcome back — tap the mic to continue.', 'system');
}
</script>
</body>
</html>
